# NEW Phase2B pilot from Phase2T 8M. Use train_phase2_terrain.py, NOT mlagents-learn.
# New counter: 0..2M. Curriculum starts at level 8, mastery window starts empty.
# Unity Phase2 scene motor: moveSpeed=6, rotationSpeed=180; branch scan=0.1s.
behaviors:
  Explorer:
    trainer_type: ppo
    init_path: results/Phase2T/Explorer/Explorer-8000127.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.002
        encoding_size: 256
        learning_rate: 3.0e-4
    max_steps: 2.0e6
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 250000
environment_parameters:
  terrain_curriculum: 1
  terrain_start_level: 8
  completed_branch_assist: 1
  terrain_map_seed: 283003
  graduated_transfer: 1
  stair_search_shaping: 1
  terrain_level:
    curriculum:
      - name: Lesson1_Coverage20
        value: 0
        completion_criteria: &mastery_only
          measure: reward
          behavior: Explorer
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 1000000
          require_reset: true
      - {name: Lesson1_Coverage30, value: 1, completion_criteria: *mastery_only}
      - {name: Lesson1_Coverage40, value: 2, completion_criteria: *mastery_only}
      - {name: Lesson2A_MouthYaw30, value: 3, completion_criteria: *mastery_only}
      - {name: Lesson2A_Tile1Yaw60, value: 4, completion_criteria: *mastery_only}
      - {name: Lesson2A_Tile2Yaw120, value: 5, completion_criteria: *mastery_only}
      - {name: Lesson2A_Tile3Yaw180, value: 6, completion_criteria: *mastery_only}
      - {name: Lesson2A_Tile4Yaw180, value: 7, completion_criteria: *mastery_only}
      - {name: Lesson2B_Balanced10, value: 8, completion_criteria: *mastery_only}
      - {name: Lesson2B_Balanced20, value: 9, completion_criteria: *mastery_only}
      - {name: Lesson2B_Balanced30, value: 10, completion_criteria: *mastery_only}
      - {name: Lesson2B_Balanced40, value: 11}
engine_settings:
  time_scale: 30
