# Phase 3: fine-tune all 177 inputs from the fixed Phase2E 7M checkpoint.
# Use train_phase3.py (mastery-based progression), NOT mlagents-learn directly.
# Original 4M budget finished at 4,000,073. User approved total 6M on Oct 27:
# approximately 2M additional steps, --resume from Phase3 (NOT reinitialize Phase2E).
# Scene episode limit 12,000; 177 inputs and time scale 40x unchanged.
behaviors:
  Explorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.002
        encoding_size: 256
        learning_rate: 3.0e-4
    init_path: results/Phase2E/Explorer/Explorer-7000033.pt
    max_steps: 6.0e6
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 250000

environment_parameters:
  phase3_curriculum: 1
  terrain_curriculum: 1
  terrain_start_level: 8
  completed_branch_assist: 0
  branch_memory_observation: 1
  terrain_distant_observation: 1
  ramp_memory_observation: 1
  terrain_map_seed: 33003
  graduated_transfer: 1
  stair_search_shaping: 0
  terrain_level:
    curriculum:
      - name: LargeTwoFloorBalanced10
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 1000000 # Disabled: exact episode mastery driver decides.
          require_reset: true
        value: 8
      - name: LargeTwoFloorBalanced20
        value: 9
engine_settings:
  time_scale: 40
