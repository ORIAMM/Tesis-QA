# Resume Phase2M5 only, NOT Phase2M4. No init_path: preserve its latest checkpoint.
behaviors:
  Explorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.002
        encoding_size: 256
        learning_rate: 3.0e-4
    max_steps: 3.0e6
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 20
    checkpoint_interval: 250000
environment_parameters:
  mastery_protocol: 1
  stair_practice: 1
  near_search_curriculum: 1
  mixed_search_curriculum: 1
  mixed_search_map_seed: 173003
  graduated_transfer: 1
  stair_search_shaping: 1
  require_stair_eval_gate: 1
  stair_eval_gate_passed: 0
  stair_search_lesson:
    curriculum:
      - name: SingleFloorExploration
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 1000000
          require_reset: true
        value: 0
      - name: StairApproachAndAscent
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 1000000
          require_reset: true
        value: 1
      - name: NearStairSearch
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 1000000
          require_reset: true
        value: 2
      - name: MixedDistanceStairSearch
        value: 3
engine_settings:
  time_scale: 40
