behaviors:
  Explorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.002
        encoding_size: 256
        learning_rate: 3.0e-4
    init_path: results\Phase2M2\Explorer\Explorer-8249944.pt
    max_steps: 8.0e6
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 250000

environment_parameters:
  graduated_transfer: 1
  floor_lesson:
    curriculum:
      - name: GuidedAscent
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: true
          min_lesson_length: 500
          threshold: 0.8
          require_reset: true
        value: 1
      - name: NearStairSearch
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: true
          min_lesson_length: 750
          threshold: 0.8
          require_reset: true
        value: 2
      - name: MixedDistanceStairSearch
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: true
          min_lesson_length: 750
          threshold: 1.0
          require_reset: true
        value: 3
      - name: BalancedCoverage10Percent
        completion_criteria:
          measure: reward
          behavior: Explorer
          signal_smoothing: true
          min_lesson_length: 750
          threshold: 1.2
          require_reset: true
        value: 4
      - name: BalancedCoverage20Percent
        value: 5

engine_settings:
  time_scale: 40
